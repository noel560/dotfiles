[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-c", "neofetch; exec zsh"]

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 10

[window]
padding.x = 12
padding.y = 12
decorations = "None"
opacity = 0.8

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]

[colors]
[colors.primary]
background = "#121212"
foreground = "#bebebe"
dim_foreground = "#8a8a8d"

[colors.cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.vi_mode_cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.selection]
text = "CellForeground"
background = "#333333"

[colors.normal]
black = "#0a0a0a"
red = "#c7612a"
green = "#e49a3a"
yellow = "#ffcc66"
blue = "#f2e6c9"
magenta = "#d88a4b"
cyan = "#f5deb3"
white = "#f2f2f2"

[colors.bright]
black = "#141414"
red = "#e07230"
green = "#f0ad4b"
yellow = "#ffd98a"
blue = "#fff3dc"
magenta = "#e9a86b"
cyan = "#fff1c7"
white = "#ffffff"
