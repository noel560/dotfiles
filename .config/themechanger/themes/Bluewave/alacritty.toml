[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-c", "neofetch; exec zsh"]

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 10

[window]
padding.x = 12
padding.y = 12
decorations = "None"
opacity = 0.8

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]

[colors]
[colors.primary]
background = "#121212"
foreground = "#bebebe"
dim_foreground = "#8a8a8d"

[colors.cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.vi_mode_cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.selection]
text = "CellForeground"
background = "#333333"

[colors.normal]
black = "#0b0b1a"
red = "#402c9c"
green = "#3558ff"
yellow = "#5a6bff"
blue = "#4b7aff"
magenta = "#9a4dff"
cyan = "#6bc7ff"
white = "#d6d7f4"

[colors.bright]
black = "#8a8a8d"
red = "#5537d1"
green = "#4b6aff"
yellow = "#7482ff"
blue = "#6b95ff"
magenta = "#b874ff"
cyan = "#95dcff"
white = "#f0f0ff"
