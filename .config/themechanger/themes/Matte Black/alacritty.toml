[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-c", "neofetch; exec zsh"]

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 10

[window]
padding.x = 12
padding.y = 12
decorations = "None"
opacity = 0.8

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]

[colors]
[colors.primary]
background = "#121212"
foreground = "#bebebe"
dim_foreground = "#8a8a8d"

[colors.cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.vi_mode_cursor]
text = "#121212"
cursor = "#eaeaea"

[colors.selection]
text = "CellForeground"
background = "#333333"

[colors.normal]
black = "#0a0a0a"
red = "#3a3a3a"
green = "#505050"
yellow = "#6a6a6a"
blue = "#7c7c7c"
magenta = "#8a8a8a"
cyan = "#9a9a9a"
white = "#c8c8c8"

[colors.bright]
black = "#141414"
red = "#4a4a4a"
green = "#666666"
yellow = "#808080"
blue = "#919191"
magenta = "#a0a0a0"
cyan = "#b1b1b1"
white = "#ebebeb"
